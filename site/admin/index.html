<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários · ChampLive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0E10;
    --painel: #18181B;
    --painel-2: #1F1F24;
    --borda: #26262C;
    --borda-botao: #34343C;
    --texto: #EFEFF1;
    --texto-fraco: #ADADB8;
    --texto-apagado: #6B6B76;
    --destaque: #F5B83D;
    --destaque-hover: #FFD27A;
    --sobre-destaque: #141414;
    --vermelho: #D13438;
    --verde: #3FB950;
    --fonte: 'DM Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
    --fonte-titulo: 'Archivo', 'DM Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--texto);
    font-family: var(--fonte);
  }
  button, input { font-family: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--destaque);
    outline-offset: 2px;
  }

  .topo {
    height: 60px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--painel);
    border-bottom: 1px solid var(--borda);
  }
  .marca {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--texto);
    text-decoration: none;
  }
  .marca-icone {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--destaque);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .marca-nome {
    font-family: var(--fonte-titulo);
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.02em;
  }
  .espaco { flex: 1; }

  .botao {
    height: 40px;
    padding: 0 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 8px;
    font: 600 14px var(--fonte);
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
  }
  .botao-contorno {
    background: transparent;
    color: var(--texto);
    border: 1px solid var(--borda-botao);
  }
  .botao-contorno:hover { background: var(--borda); }
  .botao-destaque {
    background: var(--destaque);
    color: var(--sobre-destaque);
    border: none;
    font-weight: 700;
  }
  .botao-destaque:hover { background: var(--destaque-hover); }
  .botao-perigo {
    background: transparent;
    color: #FF8A8D;
    border: 1px solid #5A2427;
  }
  .botao-perigo:hover { background: #2A1517; }
  .botao-pequeno { height: 34px; padding: 0 12px; font-size: 13px; }
  .botao:disabled { opacity: 0.5; cursor: not-allowed; }

  .pagina {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 16px 60px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    margin: 0;
    font: 800 26px var(--fonte-titulo);
    letter-spacing: -0.02em;
  }
  .subtitulo { margin: 4px 0 0; color: var(--texto-fraco); font-size: 14px; }

  .cartao {
    background: var(--painel);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 20px;
  }
  .cartao h2 {
    margin: 0 0 14px;
    font: 700 13px var(--fonte);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--texto-fraco);
  }

  .form {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px;
  }
  .campo {
    flex: 1 1 180px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--texto-fraco);
  }
  .campo input {
    height: 40px;
    padding: 0 12px;
    background: var(--bg);
    border: 1px solid var(--borda-botao);
    border-radius: 8px;
    color: var(--texto);
    font-size: 14px;
  }
  .marcar {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .marcar input { width: 16px; height: 16px; accent-color: var(--destaque); }

  .usuarios { display: flex; flex-direction: column; }
  .usuario {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-top: 1px solid var(--borda);
  }
  .usuario:first-child { border-top: none; padding-top: 0; }
  .avatar {
    width: 36px;
    height: 36px;
    flex: none;
    border-radius: 50%;
    background: var(--destaque);
    color: var(--sobre-destaque);
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 15px var(--fonte-titulo);
  }
  .usuario-nome {
    flex: 1 1 120px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .selo {
    padding: 2px 8px;
    border-radius: 999px;
    font: 700 11px var(--fonte);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .selo-admin { background: #3A2E12; color: var(--destaque); }
  .selo-voce { background: var(--borda); color: var(--texto-fraco); }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }

  .aviso {
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
  }
  .aviso-ok { background: #12261A; color: #7EE2A0; border: 1px solid #1F4A2E; }
  .aviso-erro { background: #2A1517; color: #FF8A8D; border: 1px solid #5A2427; }
  .vazio { color: var(--texto-apagado); font-size: 14px; }

  dialog {
    width: min(420px, calc(100vw - 32px));
    background: var(--painel);
    color: var(--texto);
    border: 1px solid var(--borda-botao);
    border-radius: 12px;
    padding: 20px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
  dialog h3 { margin: 0 0 6px; font: 700 18px var(--fonte-titulo); }
  dialog p { margin: 0 0 16px; color: var(--texto-fraco); font-size: 14px; }
  .dialog-botoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
</style>
</head>
<body>

<header class="topo">
  <a class="marca" href="/">
    <span class="marca-icone">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4"/><path d="M16.2 16.2a6 6 0 0 0 0-8.4"/><path d="M4.9 4.9a10 10 0 0 0 0 14.2"/><path d="M19.1 19.1a10 10 0 0 0 0-14.2"/></svg>
    </span>
    <span class="marca-nome">ChampLive</span>
  </a>
  <div class="espaco"></div>
  <a class="botao botao-contorno" href="/">Voltar às lives</a>
</header>

<main class="pagina">
  <div>
    <h1 id="titulo">Usuários</h1>
    <p class="subtitulo" id="subtitulo">carregando...</p>
  </div>

  <div class="aviso" id="aviso" role="status" hidden></div>

  <section class="cartao" id="cartaoCriar" hidden>
    <h2>Novo usuário</h2>
    <form class="form" id="formCriar">
      <label class="campo">Nome
        <input name="nome" required maxlength="32" pattern="[A-Za-z0-9._\-]+" autocomplete="off" title="Letras, números, ponto, hífen ou _">
      </label>
      <label class="campo">Senha
        <input name="senha" type="password" required minlength="6" autocomplete="new-password">
      </label>
      <label class="marcar"><input type="checkbox" name="admin"> Admin</label>
      <button type="submit" class="botao botao-destaque">Criar</button>
    </form>
  </section>

  <section class="cartao">
    <h2 id="tituloLista">Usuários</h2>
    <div class="usuarios" id="lista"></div>
  </section>
</main>

<dialog id="dlgSenha">
  <form method="dialog" id="formSenha">
    <h3>Alterar senha</h3>
    <p id="dlgSenhaTexto"></p>
    <label class="campo">Nova senha
      <input name="senha" type="password" required minlength="6" autocomplete="new-password">
    </label>
    <div class="dialog-botoes">
      <button type="button" class="botao botao-contorno" value="cancelar" onclick="this.closest('dialog').close()">Cancelar</button>
      <button type="submit" class="botao botao-destaque">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgConfirmar">
  <form method="dialog">
    <h3 id="dlgConfirmarTitulo"></h3>
    <p id="dlgConfirmarTexto"></p>
    <div class="dialog-botoes">
      <button value="nao" class="botao botao-contorno">Cancelar</button>
      <button value="sim" class="botao botao-perigo" id="dlgConfirmarBotao">Confirmar</button>
    </div>
  </form>
</dialog>

<script>
  const API = '/api/usuarios';
  const listaEl = document.getElementById('lista');
  const avisoEl = document.getElementById('aviso');
  let estado = null; // última resposta da API: {eu, admin, usuarios}

  function avisar(texto, erro) {
    avisoEl.textContent = texto;
    avisoEl.className = 'aviso ' + (erro ? 'aviso-erro' : 'aviso-ok');
    avisoEl.hidden = false;
  }

  async function chamar(pedido) {
    const r = await fetch(API, pedido ? {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-ChampLive': '1' },
      body: JSON.stringify(pedido)
    } : { cache: 'no-store' });
    let dados = null;
    try { dados = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((dados && dados.erro) || ('Erro ' + r.status + ' no servidor.'));
    return dados;
  }

  function botao(texto, classe, aoClicar, desativado) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'botao botao-pequeno ' + classe;
    b.textContent = texto;
    b.disabled = !!desativado;
    b.onclick = aoClicar;
    return b;
  }

  function selo(texto, classe) {
    const s = document.createElement('span');
    s.className = 'selo ' + classe;
    s.textContent = texto;
    return s;
  }

  function desenhar() {
    const { eu, admin, usuarios } = estado;
    document.getElementById('subtitulo').textContent = admin
      ? 'Crie, exclua e altere usuários do ChampLive.'
      : 'Você está como ' + eu + '. Aqui dá para trocar a sua senha.';
    document.getElementById('titulo').textContent = admin ? 'Usuários' : 'Minha conta';
    document.getElementById('tituloLista').textContent = admin ? 'Usuários (' + usuarios.length + ')' : 'Conta';
    document.getElementById('cartaoCriar').hidden = !admin;

    listaEl.replaceChildren();
    if (!usuarios.length) {
      listaEl.innerHTML = '<span class="vazio">Nenhum usuário.</span>';
      return;
    }
    for (const u of usuarios) {
      const souEu = u.nome === eu;
      const linha = document.createElement('div');
      linha.className = 'usuario';

      const avatar = document.createElement('span');
      avatar.className = 'avatar';
      avatar.textContent = u.nome.charAt(0).toUpperCase();

      const nome = document.createElement('span');
      nome.className = 'usuario-nome';
      nome.append(u.nome);
      if (u.admin) nome.append(selo('admin', 'selo-admin'));
      if (souEu) nome.append(selo('você', 'selo-voce'));

      const acoes = document.createElement('div');
      acoes.className = 'acoes';
      acoes.append(botao('Alterar senha', 'botao-contorno', () => alterarSenha(u.nome)));
      if (admin) {
        acoes.append(botao(u.admin ? 'Tirar admin' : 'Tornar admin', 'botao-contorno',
          () => mudarAdmin(u.nome, !u.admin), souEu && u.admin));
        acoes.append(botao('Excluir', 'botao-perigo', () => excluir(u.nome), souEu));
      }

      linha.append(avatar, nome, acoes);
      listaEl.append(linha);
    }
  }

  async function executar(pedido, mensagem) {
    try {
      estado = await chamar(pedido);
      desenhar();
      avisar(mensagem);
    } catch (e) {
      avisar(e.message, true);
    }
  }

  function confirmar(titulo, texto, rotulo) {
    const dlg = document.getElementById('dlgConfirmar');
    document.getElementById('dlgConfirmarTitulo').textContent = titulo;
    document.getElementById('dlgConfirmarTexto').textContent = texto;
    document.getElementById('dlgConfirmarBotao').textContent = rotulo;
    dlg.returnValue = '';
    dlg.showModal();
    return new Promise(ok => dlg.addEventListener('close', () => ok(dlg.returnValue === 'sim'), { once: true }));
  }

  async function excluir(nome) {
    if (!await confirmar('Excluir ' + nome + '?', 'A pessoa perde o acesso ao site na hora. Não dá para desfazer.', 'Excluir')) return;
    executar({ acao: 'excluir', nome }, nome + ' foi excluído.');
  }

  async function mudarAdmin(nome, admin) {
    if (admin && !await confirmar('Tornar ' + nome + ' admin?', 'Admins podem criar, excluir e mudar a senha de qualquer usuário.', 'Tornar admin')) return;
    executar({ acao: 'admin', nome, admin }, admin ? nome + ' agora é admin.' : nome + ' não é mais admin.');
  }

  function alterarSenha(nome) {
    const dlg = document.getElementById('dlgSenha');
    const form = document.getElementById('formSenha');
    const souEu = nome === estado.eu;
    form.reset();
    document.getElementById('dlgSenhaTexto').textContent = souEu
      ? 'Depois de salvar, o navegador vai pedir o login de novo com a senha nova.'
      : 'Nova senha para ' + nome + '.';
    form.onsubmit = () => {
      const senha = form.senha.value;
      executar({ acao: 'senha', nome, senha }, 'Senha de ' + nome + ' alterada.');
    };
    dlg.showModal();
  }

  document.getElementById('formCriar').addEventListener('submit', ev => {
    ev.preventDefault();
    const f = ev.target;
    const nome = f.nome.value.trim();
    executar({ acao: 'criar', nome, senha: f.senha.value, admin: f.admin.checked }, nome + ' foi criado.')
      .then(() => { if (avisoEl.classList.contains('aviso-ok')) f.reset(); });
  });

  chamar().then(dados => { estado = dados; desenhar(); }).catch(e => {
    document.getElementById('subtitulo').textContent = 'Não foi possível carregar os usuários.';
    avisar(e.message, true);
  });
</script>
</body>
</html>
