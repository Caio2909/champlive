# Trechos a colocar dentro de <VirtualHost *:443>
# em /etc/apache2/sites-enabled/000-default-le-ssl.conf
# Módulos necessários: sudo a2enmod proxy proxy_http ssl auth_digest rewrite

# Domínio do site. O certificado (certbot) cobre os três nomes; o antigo
# champlive.duckdns.org continua só para redirecionar quem tiver o link velho.
ServerName champbr.com
ServerAlias www.champbr.com champlive.duckdns.org

# www e o domínio antigo vão para https://champbr.com mantendo o caminho.
# Fica antes da senha: o redirect acontece sem pedir login no domínio antigo.
RewriteEngine On
RewriteCond %{HTTP_HOST} !^champbr\.com$ [NC]
RewriteRule ^ https://champbr.com%{REQUEST_URI} [R=301,L]

# Lista de lives e contador de viewers (API do MediaMTX, nunca exposta direto)
ProxyPass /api/paths http://127.0.0.1:9997/v3/paths/list
ProxyPassReverse /api/paths http://127.0.0.1:9997/v3/paths/list

# HLS de compatibilidade (fallback do player quando o WebRTC não decodifica):
# arquivos .m3u8/.mp4/.m4s/.ts em /live vão para a porta 8888 do MediaMTX.
# Precisa ficar ANTES do "ProxyPass /live" (o Apache usa a primeira regra que casar)
# e no mesmo caminho /live/<nome>/ que o MediaMTX usa, porque ele responde ao
# index.m3u8 com um redirect relativo (/live/<nome>/index.m3u8?cookieCheck=1)
# que o ProxyPassReverse não reescreve.
ProxyPassMatch "^/live/(.+\.(m3u8|mp4|m4s|ts))$" "http://127.0.0.1:8888/live/$1"

# Sinalização WebRTC: /live/<nome>/whep (assistir) e /live/<nome>/whip (transmitir)
ProxyPass /live http://127.0.0.1:8889/live
ProxyPassReverse /live http://127.0.0.1:8889/live

# Senha de acesso ao site (Digest). Criar o arquivo com:
#   sudo htdigest -c /etc/apache2/.htdigest "SEU_REALM" <usuario>
# O AuthName precisa ser igual ao realm usado no htdigest.
<Directory /var/www/html>
    AuthType Digest
    AuthName "SEU_REALM"
    AuthDigestProvider file
    AuthUserFile /etc/apache2/.htdigest
    Require valid-user
</Directory>
